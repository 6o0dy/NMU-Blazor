name: Build and Deploy to Vercel

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Server/Server.csproj
      - name: Build
        run: dotnet build Server/Server.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish Server/Server.csproj -c Release -o publish --no-restore
      - name: Fix dotnet.js
        run: |
          cd publish/wwwroot/_framework/
          for f in dotnet.*.js; do
            if echo "$f" | grep -qE '^dotnet\.[a-z0-9]+\.js$'; then
              cp "$f" dotnet.js
              break
            fi
          done
      - name: Fix blazor.webassembly placeholder
        run: |
          cd publish/wwwroot/_framework/
          BLAZOR_JS=$(ls blazor.webassembly.*.js 2>/dev/null | head -1)
          sed -i "s|blazor\.webassembly#\[\.{fingerprint}\]\.js|$BLAZOR_JS|g" ../index.html
      - name: Copy vercel.json
        run: cp vercel.json publish/wwwroot/
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: publish/wwwroot
