name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Server/Server.csproj
      - name: Build
        run: dotnet build Server/Server.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish Server/Server.csproj -c Release -o publish --no-restore
      - name: Fix dotnet.js for GitHub Pages
        run: |
          cd publish/wwwroot/_framework/
          for f in dotnet.*.js; do
            if echo "$f" | grep -qE '^dotnet\.[a-z0-9]+\.js$'; then
              cp "$f" dotnet.js
              break
            fi
          done
      - name: Fix base href
        run: |
          sed -i 's|<base href="/" />|<base href="/NMU-Blazor/" />|g' publish/wwwroot/index.html
      - name: Fix blazor.webassembly placeholder
        run: |
          cd publish/wwwroot/_framework/
          BLAZOR_JS=$(ls blazor.webassembly.*.js 2>/dev/null | head -1)
          sed -i "s|blazor\.webassembly#\[\.{fingerprint}\]\.js|$BLAZOR_JS|g" ../index.html
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
