name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore NMU.Platform.Web/NMU.Platform.Web.csproj
      - name: Build
        run: dotnet build NMU.Platform.Web/NMU.Platform.Web.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish NMU.Platform.Web/NMU.Platform.Web.csproj -c Release -o publish --no-restore
      - name: Copy dotnet.js to _framework
        run: cp publish/dotnet.js publish/wwwroot/_framework/dotnet.js
      - name: Fix base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/NMU-Blazor/" />|g' publish/wwwroot/index.html
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4